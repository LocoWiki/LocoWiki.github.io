[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "train-kline"
version = "0.2.0"
description = "把 TensorBoard 训练标量画成股票式 K 线的只读看板"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LocoWiki contributors" }]
keywords = ["reinforcement-learning", "tensorboard", "visualization", "candlestick", "training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/LocoWiki/train-kline"
Repository = "https://github.com/LocoWiki/train-kline"
Issues = "https://github.com/LocoWiki/train-kline/issues"

[project.scripts]
train-kline = "train_kline.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
train_kline = ["static/*"]
