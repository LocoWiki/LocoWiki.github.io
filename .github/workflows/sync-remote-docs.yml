name: Sync Remote Docs Index

on:
  workflow_dispatch:
  repository_dispatch:
    types: [wiki-updated]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update remote docs index
        run: node scripts/update-remote-doc-index.mjs
      - name: Update contributors cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-contributors-cache.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/content/remote-docs-index.json assets/content/contributors-cache.json; then
            echo "No changes to remote index or contributors cache"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/content/remote-docs-index.json assets/content/contributors-cache.json
            git commit -m "[auto] sync remote index and contributors cache"
            git push
          fi
